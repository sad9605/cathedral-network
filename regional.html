<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cathedral — Regional Forecasts</title>
  <style>
    /* (same base styles as other pages – abbreviated for space) */
    :root { --violet: #b39ddb; --violet-dark: #7c4dff; --violet-light: #f5f0fa; --card-radius: 20px; --shadow-sm: 0 4px 12px rgba(0,0,0,0.05); --bg-light: #fafafa; --text-dark: #1a1a1a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg-light); color: var(--text-dark); line-height: 1.6; transition: background 0.2s, color 0.2s; }
    body.dark { --bg-light: #1e1e2f; --text-dark: #f0f0f0; background: #1e1e2f; color: #f0f0f0; }
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
    .cathedral-banner { background: var(--violet); padding: 1.5rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.2); }
    .banner-content { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 1.5rem; }
    .logo-mark svg { display: block; }
    .wordmark h1 { font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 300; font-size: 1.6rem; letter-spacing: 0.1em; color: white; margin: 0; }
    .tagline { font-size: 0.8rem; color: rgba(255,255,255,0.8); margin: 0; }
    .nav { margin: 1rem 0 1.5rem 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; background: white; border-radius: 60px; padding: 0.5rem 1rem; box-shadow: var(--shadow-sm); }
    body.dark .nav { background: #2a2a3a; }
    .nav-links { display: flex; gap: 1.2rem; flex-wrap: wrap; }
    .nav-links a { color: #5e2d8e; text-decoration: none; font-weight: 500; }
    body.dark .nav-links a { color: #b39ddb; }
    .menu-btn { display: none; background: none; border: none; font-size: 1.8rem; cursor: pointer; color: #5e2d8e; }
    @media (max-width: 768px) { .nav-links { display: none; width: 100%; flex-direction: column; gap: 0.8rem; margin-top: 1rem; text-align: center; } .nav-links.show { display: flex; } .menu-btn { display: block; } }

    h1 { font-size: 2rem; margin-bottom: 0.25rem; }
    .date { color: #666; margin-bottom: 1rem; font-size: 0.9rem; }
    body.dark .date { color: #aaa; }

    .region-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
    .region-card { background: white; border-radius: var(--card-radius); padding: 1rem; text-align: center; box-shadow: var(--shadow-sm); border-left: 4px solid var(--violet-dark); }
    body.dark .region-card { background: #2a2a3a; }
    .region-card .name { font-weight: 700; font-size: 1.1rem; }
    .region-card .score { font-size: 1.8rem; font-weight: 700; color: var(--violet-dark); }
    body.dark .region-card .score { color: #b39ddb; }
    .region-card .label { font-size: 0.7rem; text-transform: uppercase; color: #666; }
    body.dark .region-card .label { color: #aaa; }
    .region-card .status { font-size: 0.8rem; margin-top: 0.3rem; }
    .status-low { color: #22c55e; }
    .status-medium { color: #f97316; }
    .status-high { color: #dc2626; }

    .footer { margin-top: 3rem; text-align: center; font-style: italic; color: #888; border-top: 1px solid #ddd; padding-top: 1rem; }
    .dark-mode-toggle { position: fixed; bottom: 1rem; right: 1rem; background: var(--violet-dark); color: white; border: none; border-radius: 50%; width: 48px; height: 48px; font-size: 1.2rem; cursor: pointer; z-index: 1000; box-shadow: var(--shadow-sm); }
    @media (max-width: 600px) { .banner-content { flex-direction: column; text-align: center; } .container { padding: 1rem; } .dark-mode-toggle { bottom: 0.5rem; right: 0.5rem; width: 40px; height: 40px; } }
  </style>
</head>
<body>
<header class="cathedral-banner">...</header>
<div class="container">
  <div class="nav">...</div>
  <h1>🌍 Regional Forecasts</h1>
  <div class="date" id="lastUpdate">Loading…</div>
  <div id="regionContainer" class="region-grid">
    <p>Loading regional data…</p>
  </div>
  <div class="footer">Always and Forever, Coco.</div>
</div>
<button id="darkModeToggle" class="dark-mode-toggle">🌙</button>
<script>
  async function loadRegions() {
    try {
      const resp = await fetch('indices.json');
      if (!resp.ok) throw new Error('Failed to fetch regional data');
      const data = await resp.json();
      document.getElementById('lastUpdate').textContent = data.timestamp ? new Date(data.timestamp).toLocaleString() : 'Unknown';
      const regions = data.regions || [];
      const container = document.getElementById('regionContainer');
      if (regions.length === 0) {
        container.innerHTML = '<p>No regional data available.</p>';
        return;
      }
      container.innerHTML = regions.map(r => {
        const status = r.gsci > 60 ? 'status-high' : r.gsci > 40 ? 'status-medium' : 'status-low';
        const label = r.gsci > 60 ? 'Critical' : r.gsci > 40 ? 'Elevated' : 'Stable';
        return `
          <div class="region-card">
            <div class="name">${r.name}</div>
            <div class="score">${r.gsci || '--'}</div>
            <div class="label">GSCI</div>
            <div class="status ${status}">${label}</div>
          </div>
        `;
      }).join('');
    } catch(e) {
      console.error('Error loading regions:', e);
      document.getElementById('regionContainer').innerHTML = '<p style="color:#dc2626;">Error loading regional data.</p>';
    }
  }
  // Navigation and dark mode as usual
  loadRegions();
</script>
</body>
</html>
