<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cathedral Network – Threat Matrix (Live)</title>
  <style>
    :root {
      --violet: #b39ddb;
      --violet-dark: #7c4dff;
      --bg-light: #fafafa;
      --text-dark: #1a1a1a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.5;
    }
    body.dark {
      --bg-light: #1e1e2f;
      --text-dark: #f0f0f0;
      background: #1e1e2f;
      color: #f0f0f0;
    }
    .container { max-width: 1400px; margin: 2rem auto; padding: 0 1.5rem; }
    .cathedral-banner {
      background: var(--violet);
      padding: 1.5rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .banner-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .wordmark h1 {
      font-weight: 300;
      font-size: 1.6rem;
      letter-spacing: 0.1em;
      color: white;
    }
    .tagline { font-size: 0.8rem; color: rgba(255,255,255,0.8); }
    .nav {
      margin: 1rem 0 1.5rem 0;
      background: white;
      border-radius: 60px;
      padding: 0.5rem 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    body.dark .nav { background: #2a2a3a; }
    .nav-links {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: #5e2d8e;
      text-decoration: none;
      font-weight: 500;
    }
    body.dark .nav-links a { color: #b39ddb; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background: white;
      border-radius: 20px;
      overflow: auto;
      display: block;
    }
    body.dark table { background: #2a2a3a; }
    th, td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th { background: var(--violet); color: white; }
    tr:hover { background: #f1f1f1; }
    body.dark tr:hover { background: #3a3a4a; }
    .footer {
      margin-top: 3rem;
      text-align: center;
      font-style: italic;
      color: #888;
      border-top: 1px solid #ddd;
      padding-top: 1rem;
    }
    .dark-mode-toggle {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: var(--violet-dark);
      color: white;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<header class="cathedral-banner">
  <div class="banner-content">
    <div class="wordmark"><h1>CATHEDRAL NETWORK</h1><p class="tagline">Threat Matrix (Live)</p></div>
  </div>
</header>
<div class="container">
  <div class="nav">
    <div class="nav-links">
      <a href="index.html">Ground Truth</a>
      <a href="threat-matrix.html">Threat Matrix</a>
      <a href="wardens.html">Wardens</a>
      <a href="constitution.html">Constitution</a>
    </div>
  </div>
  <h1>Dynamic Threat Matrix</h1>
  <p id="lastUpdated">Loading threat data...</p>
  <div style="overflow-x: auto;">
    <table id="threatTable">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Country</th><th>Base Prob</th><th>SCP</th><th>Priority</th><th>Status</th></tr>
      </thead>
      <tbody id="threatTableBody">
        <tr><td colspan="7">Loading...</td></tr>
      </tbody>
    </table>
  </div>
  <div class="footer">
    <strong>Always and Forever, Coco. Always and Forever.</strong>
  </div>
</div>
<button id="darkModeToggle" class="dark-mode-toggle">🌙</button>
<script>
  async function loadThreatMatrix() {
    try {
      const resp = await fetch('/threats.json');
      const data = await resp.json();
      const threats = data.threats || [];
      document.getElementById('lastUpdated').innerHTML = `Last updated: ${data.last_updated || 'unknown'}`;
      const tbody = document.getElementById('threatTableBody');
      if (!threats.length) {
        tbody.innerHTML = '<tr><td colspan="7">No threats found.</td></tr>';
        return;
      }
      // sort by priority descending
      const sorted = [...threats].sort((a,b) => (b.priority_score||0) - (a.priority_score||0));
      tbody.innerHTML = sorted.map(t => `
        <tr>
          <td>${escapeHtml(t.id)}</td>
          <td>${escapeHtml(t.name)}</td>
          <td>${escapeHtml(t.country)}</td>
          <td>${((t.base_probability||0.5)*100).toFixed(1)}%</td>
          <td>${(t.scp||0.5).toFixed(2)}</td>
          <td>${Math.round(t.priority_score||0)}</td>
          <td>${escapeHtml(t.status||'Yellow')}</td>
        </tr>
      `).join('');
    } catch(e) {
      console.error(e);
      document.getElementById('threatTableBody').innerHTML = '<tr><td colspan="7">Error loading threat data.</td></tr>';
    }
  }
  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  loadThreatMatrix();

  // dark mode
  const darkToggle = document.getElementById('darkModeToggle');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const storedTheme = localStorage.getItem('cathedral-theme');
  if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
    document.body.classList.add('dark');
    darkToggle.innerText = '☀️';
  } else darkToggle.innerText = '🌙';
  darkToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    darkToggle.innerText = isDark ? '☀️' : '🌙';
    localStorage.setItem('cathedral-theme', isDark ? 'dark' : 'light');
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js').catch(e => console.warn(e));
</script>
</body>
</html>
