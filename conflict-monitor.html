<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cathedral Network – Conflict Monitor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Cesium -->
    <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Widgets/widgets.css" />
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Cesium.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a12;
            color: #e0e0e0;
            overflow-x: hidden;
        }
        .monitor-wrapper { max-width: 1600px; margin: 0 auto; padding: 20px 30px; }
        .monitor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a2a3a;
            padding-bottom: 16px;
        }
        .monitor-header h1 { font-size: 28px; font-weight: 600; color: #fff; }
        .monitor-header h1 i { color: #b388ff; margin-right: 10px; }
        .badge-version { background: #2a2a3a; padding: 6px 14px; border-radius: 30px; font-size: 13px; color: #b388ff; }
        .last-updated { font-size: 14px; color: #888; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: #14141f;
            border-radius: 16px;
            padding: 18px 20px;
            border: 1px solid #28283a;
        }
        .stat-card .label { font-size: 13px; text-transform: uppercase; color: #9e9eae; }
        .stat-card .number { font-size: 36px; font-weight: 700; color: #fff; }
        .stat-card .number.critical { color: #ff6b6b; }
        .stat-card .number.high { color: #ffa94d; }
        .stat-card .number.elevated { color: #ffd93d; }
        .stat-card .number.moderate { color: #6bcb8a; }

        .globe-section {
            position: relative;
            background: #0a0a12;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #2a2a3a;
            margin-bottom: 28px;
            height: 500px;
        }
        .globe-container { width: 100%; height: 100%; position: relative; }
        .globe-view { width: 100%; height: 100%; display: none; }
        .globe-view.active { display: block; }

        .globe-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 100;
            display: flex;
            gap: 8px;
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(8px);
            padding: 6px;
            border-radius: 40px;
            border: 1px solid #3a3a4e;
        }
        .globe-toggle button {
            background: transparent;
            border: none;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .globe-toggle button.active {
            background: #6c5b8a;
            color: #fff;
            box-shadow: 0 0 12px rgba(108, 91, 138, 0.5);
        }
        .globe-toggle button:hover:not(.active) { color: #fff; background: #2a2a3e; }

        .table-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }
        .table-controls .search-box {
            display: flex;
            align-items: center;
            background: #14141f;
            border: 1px solid #2a2a3a;
            border-radius: 40px;
            padding: 6px 16px;
            flex: 1 1 280px;
        }
        .table-controls .search-box i { color: #6c6c82; margin-right: 10px; }
        .table-controls .search-box input {
            background: transparent;
            border: none;
            color: #e0e0e0;
            padding: 10px 0;
            width: 100%;
            outline: none;
            font-size: 14px;
        }
        .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn {
            background: #14141f;
            border: 1px solid #2a2a3a;
            color: #aaa;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active { background: #6c5b8a; border-color: #6c5b8a; color: #fff; }
        .filter-btn:hover:not(.active) { border-color: #6c5b8a; color: #fff; }

        .table-wrap {
            background: #14141f;
            border-radius: 16px;
            border: 1px solid #2a2a3a;
            overflow-x: auto;
            padding: 4px 0;
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        table th {
            text-align: left;
            padding: 14px 18px;
            color: #9e9eae;
            font-weight: 500;
            border-bottom: 1px solid #2a2a3a;
            text-transform: uppercase;
            font-size: 12px;
        }
        table td { padding: 14px 18px; border-bottom: 1px solid #1e1e2e; }
        table tr:hover td { background: #1a1a2a; }
        .conflict-name { font-weight: 500; color: #fff; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.critical { background: #6b2a2a; color: #ff6b6b; }
        .status-badge.high { background: #6b4a1a; color: #ffa94d; }
        .status-badge.elevated { background: #5a4a1a; color: #ffd93d; }
        .status-badge.moderate { background: #1a4a2a; color: #6bcb8a; }
        .scp-bar {
            display: inline-block;
            width: 60px;
            height: 6px;
            background: #2a2a3a;
            border-radius: 6px;
            overflow: hidden;
            margin-right: 8px;
        }
        .scp-bar .fill { height: 100%; border-radius: 6px; }
        .no-results { text-align: center; padding: 40px 0; color: #888; }

        @media (max-width: 768px) {
            .monitor-wrapper { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .globe-section { height: 300px; }
        }
    </style>
</head>
<body>

<div class="monitor-wrapper">
    <header class="monitor-header">
        <div>
            <h1><i class="fas fa-globe-americas"></i>Conflict Monitor</h1>
            <span class="last-updated" id="lastUpdated">Last updated: loading...</span>
        </div>
        <div>
            <span class="badge-version"><i class="fas fa-code-branch"></i> v3.2 · Cathedral</span>
        </div>
    </header>

    <div class="stats-grid" id="statCards">
        <div class="stat-card"><div class="label">Total Conflicts</div><div class="number" id="totalCount">0</div></div>
        <div class="stat-card"><div class="label">Critical</div><div class="number critical" id="criticalCount">0</div></div>
        <div class="stat-card"><div class="label">High</div><div class="number high" id="highCount">0</div></div>
        <div class="stat-card"><div class="label">Elevated</div><div class="number elevated" id="elevatedCount">0</div></div>
        <div class="stat-card"><div class="label">Moderate</div><div class="number moderate" id="moderateCount">0</div></div>
    </div>

    <div class="globe-section">
        <div class="globe-container">
            <div id="cesiumContainer" class="globe-view active"></div>
            <div id="hologramContainer" class="globe-view"></div>
        </div>
        <div class="globe-toggle">
            <button id="btnSatellite" class="active" data-view="satellite"><i class="fas fa-satellite"></i> Satellite</button>
            <button id="btnHologram" data-view="hologram"><i class="fas fa-cube"></i> Hologram</button>
        </div>
    </div>

    <div class="table-controls">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search conflict, region, actor..." />
        </div>
        <div class="filter-group" id="filterGroup">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="critical">Critical</button>
            <button class="filter-btn" data-filter="high">High</button>
            <button class="filter-btn" data-filter="elevated">Elevated</button>
            <button class="filter-btn" data-filter="moderate">Moderate</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr><th>Conflict / Event</th><th>Region</th><th>Status</th><th>SCP</th><th>Last Updated</th></tr>
            </thead>
            <tbody id="conflictTableBody">
                <tr><td colspan="5" class="no-results">Loading conflict data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ============================================================ -->
<!-- THREE.JS (via CDN, no importmap needed) -->
<!-- ============================================================ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ================================================================
// 1. DATA LOADING & UI
// ================================================================
let allConflicts = [];
let filteredConflicts = [];
let currentFilter = 'all';
let searchQuery = '';

function getSeverity(scp) {
    if (scp >= 0.80) return 'critical';
    if (scp >= 0.60) return 'high';
    if (scp >= 0.40) return 'elevated';
    return 'moderate';
}

async function loadData() {
    try {
        const res = await fetch('conflict_data.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allConflicts = data.threats || data.conflicts || [];
        allConflicts.forEach(c => {
            c.scp = c.scp || 0;
            c.severity = getSeverity(c.scp);
            c.status = c.status || c.severity;
            c.last_updated = c.last_updated || c.timestamp || new Date().toISOString();
        });
        allConflicts.sort((a,b) => b.scp - a.scp);
        updateStats();
        applyFilters();
        document.getElementById('lastUpdated').textContent = `Last updated: ${new Date().toLocaleString()}`;
        // Update globe markers
        updateCesiumMarkers(allConflicts);
    } catch (err) {
        console.warn('Data load error:', err);
        document.getElementById('conflictTableBody').innerHTML =
            `<tr><td colspan="5" class="no-results">⚠️ Could not load conflict data. Check console.</td></tr>`;
    }
}

function updateStats() {
    const critical = allConflicts.filter(c => c.severity === 'critical').length;
    const high = allConflicts.filter(c => c.severity === 'high').length;
    const elevated = allConflicts.filter(c => c.severity === 'elevated').length;
    const moderate = allConflicts.filter(c => c.severity === 'moderate').length;
    document.getElementById('totalCount').textContent = allConflicts.length;
    document.getElementById('criticalCount').textContent = critical;
    document.getElementById('highCount').textContent = high;
    document.getElementById('elevatedCount').textContent = elevated;
    document.getElementById('moderateCount').textContent = moderate;
}

function applyFilters() {
    const query = searchQuery.toLowerCase().trim();
    filteredConflicts = allConflicts.filter(c => {
        if (currentFilter !== 'all' && c.severity !== currentFilter) return false;
        if (query) {
            const name = (c.name || '').toLowerCase();
            const region = (c.region || '').toLowerCase();
            const actors = (c.actors || []).join(' ').toLowerCase();
            if (!name.includes(query) && !region.includes(query) && !actors.includes(query)) return false;
        }
        return true;
    });
    renderTable();
}

function renderTable() {
    const tbody = document.getElementById('conflictTableBody');
    if (!filteredConflicts.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="no-results">No conflicts match your criteria.</td></tr>`;
        return;
    }
    let html = '';
    filteredConflicts.forEach(c => {
        const scp = c.scp || 0;
        const pct = Math.min(100, scp * 100);
        const statusClass = c.severity || 'unknown';
        const statusLabel = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
        const color = scp >= 0.8 ? '#ff6b6b' : scp >= 0.6 ? '#ffa94d' : scp >= 0.4 ? '#ffd93d' : '#6bcb8a';
        html += `<tr>
            <td class="conflict-name">${c.name || 'Unnamed'}</td>
            <td>${c.region || '—'}</td>
            <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
            <td>
                <div class="scp-bar"><div class="fill" style="width:${pct}%; background:${color}"></div></div>
                ${(scp*100).toFixed(1)}%
            </td>
            <td>${c.last_updated ? new Date(c.last_updated).toLocaleDateString() : '—'}</td>
        </tr>`;
    });
    tbody.innerHTML = html;
}

// Search & filter events
document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    applyFilters();
});
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        applyFilters();
    });
});

// ================================================================
// 2. GLOBE TOGGLE
// ================================================================
const satelliteBtn = document.getElementById('btnSatellite');
const hologramBtn = document.getElementById('btnHologram');
const cesiumView = document.getElementById('cesiumContainer');
const hologramView = document.getElementById('hologramContainer');

satelliteBtn.addEventListener('click', () => {
    satelliteBtn.classList.add('active');
    hologramBtn.classList.remove('active');
    cesiumView.classList.add('active');
    hologramView.classList.remove('active');
    if (window.cesiumViewer) setTimeout(() => window.cesiumViewer.resize(), 100);
});
hologramBtn.addEventListener('click', () => {
    hologramBtn.classList.add('active');
    satelliteBtn.classList.remove('active');
    hologramView.classList.add('active');
    cesiumView.classList.remove('active');
});

// ================================================================
// 3. CESIUM SATELLITE GLOBE
// ================================================================
function initCesium() {
    try {
        const container = document.getElementById('cesiumContainer');
        // Use a valid token (free tier for localhost/GitHub Pages)
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4ZWI5ZGM3OC1lNjdmLTQzM2UtODg3YS05M2I3NWM0Y2NmYjYiLCJpZCI6MjM2MTYxLCJpYXQiOjE3MTU1ODkzNDl9.9zG9hZ6cJkG4k3s5Dl2lE9p8mBc6q_1zW';
        const viewer = new Cesium.Viewer(container, {
            baseLayerPicker: false,
            animation: false,
            timeline: false,
            fullscreenButton: false,
            geocoder: false,
            homeButton: false,
            sceneModePicker: false,
            navigationHelpButton: false,
            selectionIndicator: false,
            infoBox: false,
            terrainProvider: new Cesium.createWorldTerrain(),
        });
        viewer.cesiumWidget.creditContainer.style.display = 'none';
        // Use satellite imagery
        viewer.scene.imageryLayers.removeAll();
        viewer.scene.imageryLayers.addImageryProvider(
            new Cesium.IonImageryProvider({ assetId: 2 })
        );
        viewer.scene.globe.enableLighting = true;
        window.cesiumViewer = viewer;
        updateCesiumMarkers(allConflicts);
        console.log('✅ Cesium satellite globe initialized');
    } catch (err) {
        console.error('❌ Cesium init error:', err);
        document.getElementById('cesiumContainer').innerHTML =
            `<div style="color:#888;text-align:center;padding-top:200px;">⚠️ Satellite globe unavailable<br><small>${err.message}</small></div>`;
    }
}

function updateCesiumMarkers(conflicts) {
    const viewer = window.cesiumViewer;
    if (!viewer) return;
    // Remove old markers
    if (window.cesiumEntityIds) {
        window.cesiumEntityIds.forEach(id => viewer.entities.removeById(id));
    }
    window.cesiumEntityIds = [];
    conflicts.forEach(c => {
        if (c.lat && c.lng) {
            const color = c.scp >= 0.8 ? Cesium.Color.RED :
                          c.scp >= 0.6 ? Cesium.Color.ORANGE :
                          c.scp >= 0.4 ? Cesium.Color.YELLOW : Cesium.Color.GREEN;
            const entity = viewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(c.lng, c.lat, 50000),
                point: {
                    pixelSize: 14,
                    color: color,
                    outlineColor: Cesium.Color.WHITE,
                    outlineWidth: 1,
                },
                label: {
                    text: c.name || '',
                    font: '12px Inter',
                    fillColor: Cesium.Color.WHITE,
                    outlineColor: Cesium.Color.BLACK,
                    outlineWidth: 2,
                    pixelOffset: new Cesium.Cartesian2(0, -20),
                },
                id: 'marker_' + Math.random().toString(36).substr(2, 9),
            });
            window.cesiumEntityIds.push(entity.id);
        }
    });
}

// ================================================================
// 4. HOLOGRAM GLOBE (Three.js – simplified, no importmap)
// ================================================================
let hologramScene, hologramCamera, hologramRenderer, hologramControls, hologramGlobe;

function initHologram() {
    try {
        const container = document.getElementById('hologramContainer');
        const width = container.clientWidth || 500;
        const height = container.clientHeight || 500;

        hologramScene = new THREE.Scene();
        hologramScene.background = new THREE.Color(0x050510);

        hologramCamera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        hologramCamera.position.set(0, 0, 4.5);

        hologramRenderer = new THREE.WebGLRenderer({ antialias: true });
        hologramRenderer.setSize(width, height);
        hologramRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(hologramRenderer.domElement);

        hologramControls = new THREE.OrbitControls(hologramCamera, hologramRenderer.domElement);
        hologramControls.enableDamping = true;
        hologramControls.autoRotate = true;
        hologramControls.autoRotateSpeed = 1.2;
        hologramControls.minDistance = 2.5;
        hologramControls.maxDistance = 10;

        // Hologram sphere
        const geometry = new THREE.SphereGeometry(1.6, 64, 64);
        const material = new THREE.MeshPhongMaterial({
            color: 0x9b59b6,
            emissive: 0x6c3483,
            emissiveIntensity: 0.4,
            transparent: true,
            opacity: 0.7,
            shininess: 30,
            wireframe: false,
        });
        hologramGlobe = new THREE.Mesh(geometry, material);
        hologramScene.add(hologramGlobe);

        // Wireframe overlay
        const wireGeo = new THREE.SphereGeometry(1.62, 24, 12);
        const wireMat = new THREE.MeshBasicMaterial({
            color: 0x9b59b6,
            wireframe: true,
            transparent: true,
            opacity: 0.2,
        });
        const wireframe = new THREE.Mesh(wireGeo, wireMat);
        hologramScene.add(wireframe);

        // Glow ring (equator)
        const ringGeo = new THREE.TorusGeometry(1.7, 0.02, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0x9b59b6,
            transparent: true,
            opacity: 0.6,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        hologramScene.add(ring);

        // Stars
        const starsGeo = new THREE.BufferGeometry();
        const starCount = 1500;
        const positions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            const r = 8 + Math.random() * 25;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            positions[i] = r * Math.sin(phi) * Math.cos(theta);
            positions[i+1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i+2] = r * Math.cos(phi);
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x8e44ad,
            size: 0.06,
            transparent: true,
            opacity: 0.7,
        });
        const stars = new THREE.Points(starsGeo, starsMat);
        hologramScene.add(stars);

        // Lights
        const ambient = new THREE.AmbientLight(0x404060);
        hologramScene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(1, 1, 1);
        hologramScene.add(dirLight);

        // Animate
        function animate() {
            requestAnimationFrame(animate);
            if (hologramControls) hologramControls.update();
            if (hologramGlobe) hologramGlobe.rotation.y += 0.001;
            if (hologramRenderer && hologramScene && hologramCamera) {
                hologramRenderer.render(hologramScene, hologramCamera);
            }
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            const w = container.clientWidth || 500;
            const h = container.clientHeight || 500;
            if (hologramCamera) {
                hologramCamera.aspect = w / h;
                hologramCamera.updateProjectionMatrix();
            }
            if (hologramRenderer) hologramRenderer.setSize(w, h);
        });

        console.log('✅ Hologram globe initialized');
    } catch (err) {
        console.error('❌ Hologram init error:', err);
        document.getElementById('hologramContainer').innerHTML =
            `<div style="color:#888;text-align:center;padding-top:200px;">⚠️ Hologram globe unavailable<br><small>${err.message}</small></div>`;
    }
}

// ================================================================
// 5. INIT
// ================================================================
document.addEventListener('DOMContentLoaded', async () => {
    await loadData();
    initCesium();
    initHologram();
    // Ensure hologram is hidden initially
    hologramView.classList.remove('active');
    cesiumView.classList.add('active');
});
</script>
</body>
</html>
